name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m jeb validate --stage schemas
      - run: python -m jeb sources audit
      - run: python -m jeb sources inspect --source crosswire-srkdijekav
      - run: python -m jeb sources research prepare --source crosswire-srkdijekav --packet-id ci-source-metadata
      - run: python -m jeb toolchain validate --input tests/fixtures/sword/synthetic-probe.jsonl
      - run: python -m unittest discover -s tests -v
      - run: python -m jeb demo
      - run: python -m jeb --root dist/demo --synthetic review assist prepare --proposal fixture-modernize-v1-40b78ddaba32f24c --packet-id fixture-review-v1
      - run: python -m jeb --root dist/demo --synthetic review assist validate --input reports/review-assistance-synthetic-response.json
      - run: python -m jeb --root dist/demo --synthetic knowledge prepare --source synthetic-v1 --selection fixture --task research --packet-id fixture-passage-research-v1
      - run: python -m jeb --root dist/demo --synthetic knowledge prepare --source synthetic-v1 --selection fixture --task annotate --packet-id fixture-annotations-v1
      - run: python -m jeb --root dist/demo --synthetic knowledge validate --input reports/passage-research-synthetic-response.json
      - run: python -m jeb --root dist/demo --synthetic knowledge validate --input reports/annotation-synthetic-response.json
      - run: python -m jeb --root dist/demo --synthetic knowledge import --input reports/annotation-synthetic-response.json
      - run: python -m jeb --root dist/demo --synthetic knowledge review export --packet-id fixture-annotations-v1 --response-sha256 2145bfcaf36f897f2cbcee25cd910f32c190ad845889d838d48e3f048bf296de --output reports/human-knowledge-review.md
      - run: python -m jeb --root dist/demo --synthetic knowledge curate export --source synthetic-v1 --output reports/knowledge-curation.md
      - run: python -m jeb --root dist/demo --synthetic knowledge narrative prepare --source synthetic-v1 --selection fixture --packet-id fixture-narrative-v1
      - run: python -m jeb --root dist/demo --synthetic knowledge narrative validate --input reports/narrative-synthetic-response.json
      - run: python -m jeb --root dist/demo --synthetic knowledge narrative import --input reports/narrative-synthetic-response.json
      - run: python -m jeb --root dist/demo --synthetic knowledge narrative report --input reports/narrative-synthetic-response.json --output reports/narrative.md
      - run: python -m jeb --root dist/demo --synthetic knowledge narrative review export --packet-id fixture-narrative-v1 --response-sha256 14daac25578624d336fa2b0f004318bd662ee874f212d69b56e9cbdceaee6733 --output reports/narrative-review.md
      - run: python -m jeb --root dist/demo --synthetic archive create --source synthetic-v1 --archive-id ci-fixture-build --output dist/archives/ci-fixture-build.zip
      - run: python -m jeb --synthetic archive validate --input dist/demo/dist/archives/ci-fixture-build.zip
      - run: python -m jeb --synthetic archive restore --input dist/demo/dist/archives/ci-fixture-build.zip --destination dist/ci-restored-build
      - run: python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist/wheels .
