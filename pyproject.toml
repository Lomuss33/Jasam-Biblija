[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "jugoslavenska-ekumenska-biblija"
version = "0.1.0.dev0"
description = "Provenance and editorial tooling for a five-book historical-text modernization"
requires-python = ">=3.13,<3.14"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.26.0"]
license = "MIT"
license-files = ["LICENSES/*.txt", "NOTICE.md"]

[project.scripts]
jeb = "jeb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jeb = ["schemas/*.json", "assets/*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
